name: Gold & World Politics Bot

on:
  schedule:
    # The US 08:30 New York data release is 12:30 UTC (= 14:30 SAST) in US summer time
    # and 13:30 UTC (= 15:30 SAST) in US winter time. The bot runs ~45 min before each
    # so the forecast is ready BEFORE the news drops. Mon-Fri only.
    - cron: "45 11 * * 1-5" # 13:45 SAST -> ahead of the 14:30 SAST window
    - cron: "45 12 * * 1-5" # 14:45 SAST -> ahead of the 15:30 SAST window
  workflow_dispatch: # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: gold-bot
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the bot
        run: npx tsx bot/run.ts
        env:
          # All optional - add them under Settings > Secrets and variables > Actions
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit report
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add reports
          git diff --staged --quiet || git commit -m "Gold report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
